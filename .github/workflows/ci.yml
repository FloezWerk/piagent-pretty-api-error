name: CI

# Runs on every push to main and on pull requests. This validates changes
# early; the tag-triggered release workflow (release.yml) only publishes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The extension has no runtime dependencies (pi bundles its peers), so
      # there is nothing to install - bundling with peers kept external is the
      # quickest "does it compile" check.
      - name: Bundle smoke test (pi peers stay external)
        run: |
          npx -y esbuild@0.25.12 extensions/api-error-format.ts \
            --bundle --format=esm --platform=node \
            --external:@earendil-works/* \
            --outfile=/tmp/api-error-format.mjs

      # The extension is loaded from source by pi - the tarball must contain
      # everything a user needs and nothing else.
      - name: Package content check (npm pack dry-run)
        run: npm pack --dry-run

      # AGENTS.md: this project is English-only.
      - name: No-German guard
        run: |
          if grep -rInP '[äöüÄÖÜß]' README.md AGENTS.md extensions package.json; then
            echo '::error::German text found (see AGENTS.md: English only)'
            exit 1
          fi
