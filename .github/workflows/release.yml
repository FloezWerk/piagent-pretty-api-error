name: Release

# Triggered by pushing a version tag (vX.Y.Z). Publishing happens here and
# only here; CI (ci.yml) validates every commit beforehand. The checks below
# are repeated because a tag may also point at a commit that never ran CI.
#
# pi.dev/packages needs no extra publish step: the gallery automatically lists
# npm packages carrying the "pi-package" keyword (already in package.json).
#
# Required secret: NPM_TOKEN (npm automation token).
# Optional gate: uncomment "environment: release" and configure the GitHub
# environment "release" with required reviewers for a manual approval step
# before every publish.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Guards: tag must match the package version, and that version must not
      # already exist on npm (publishing a moved/reused tag would otherwise
      # fail late or, worse, silently do nothing).
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify version not already published
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VER")"
          if [ "$CODE" = "200" ]; then
            echo "::error::$PKG@$VER is already published on npm"
            exit 1
          fi

      - name: Bundle smoke test (pi peers stay external)
        run: |
          npx -y esbuild@0.25.12 extensions/api-error-format.ts \
            --bundle --format=esm --platform=node \
            --external:@earendil-works/* \
            --outfile=/tmp/api-error-format.mjs

      - name: Package content check (npm pack dry-run)
        run: npm pack --dry-run

      # The extension is plain TypeScript loaded by pi - no build step needed.
      - name: Publish to npm (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build tarball for the GitHub release
        run: npm pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: piagent-pretty-api-error-*.tgz
          generate_release_notes: true
